<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arya Shrestha - Software Engineer & Full-Stack Developer. Explore my portfolio featuring React, Python, and creative web development projects." />
    <meta name="keywords" content="Arya Shrestha, Software Engineer, Full-Stack Developer, React, Python, Portfolio, Web Development" />
    <meta name="author" content="Arya Shrestha" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arya Shrestha | Portfolio" />
    <meta property="og:description" content="Software Engineer & Full-Stack Developer. Explore my portfolio featuring React, Python, and creative web development projects." />
    <meta property="og:url" content="https://aryashrestha.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arya Shrestha | Portfolio" />
    <meta name="twitter:description" content="Software Engineer & Full-Stack Developer. Explore my portfolio featuring React, Python, and creative web development projects." />

    <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet">
    <title>Arya Shrestha | Portfolio</title>
    <style>
      /* Prevent flash of unstyled content */
      html.dark {
        background-color: #161515;
        color-scheme: dark;
      }
      html:not(.dark) {
        background-color: #ffffff;
        color-scheme: light;
      }
      /* Fallback loading indicator */
      #root:empty::after {
        content: 'Loading...';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #888;
        font-family: system-ui, sans-serif;
      }
    </style>
    <script>
      // Restore theme from localStorage before page renders
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
