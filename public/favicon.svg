<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a3a3a3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#161515" stroke="#333" stroke-width="2"/>
  <!-- Letter A -->
  <text x="28" y="68" font-family="Georgia, serif" font-size="48" font-weight="400" fill="url(#grad)">A</text>
  <!-- Letter S - slightly overlapping -->
  <text x="52" y="68" font-family="Georgia, serif" font-size="48" font-weight="400" fill="url(#grad)" opacity="0.85">S</text>
  <!-- Subtle glow effect -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
</svg>
